name: Agent metrics

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: agent-metrics
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Check live switch
        env:
          AGENTS_ENABLED: ${{ vars.AGENTS_ENABLED }}
        run: test "$AGENTS_ENABLED" = "true"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Produce typed empty baseline when no authenticated results exist
        run: |
          printf '[]\n' > agent-results.json
          python3 scripts/agent_metrics.py --input agent-results.json > metrics.csv
          echo "Missing live cross-repository evidence is represented as missing, never synthesized." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: agent-metrics-${{ github.run_id }}-${{ github.run_attempt }}
          path: metrics.csv
          retention-days: 30
