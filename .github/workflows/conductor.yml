name: Agent conductor

on:
  schedule:
    - cron: "7,37 * * * *"
  repository_dispatch:
    types: [lp-issue-ready, lp-pr-merged, lp-agent-result]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Propose transitions without mutations
        required: true
        type: boolean
        default: true
      fixture:
        description: Checked-in fixture name
        required: false
        type: string
        default: cycles.json

permissions: {}

concurrency:
  group: launchpad-conductor
  cancel-in-progress: false

jobs:
  policy-dry-run:
    name: Conductor policy dry run
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      AGENTS_ENABLED: ${{ vars.AGENTS_ENABLED }}
    steps:
      - name: Fail closed at bootstrap gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref }}
        run: |
          test "$REPOSITORY" = "launch-pad-021/launchpad-meta"
          test "$REF_NAME" = "refs/heads/main"
          if [ "$AGENTS_ENABLED" != "true" ]; then
            echo "Agents are disabled or the live variable is unavailable." >> "$GITHUB_STEP_SUMMARY"
            exit 78
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Evaluate credential-free fixture
        run: |
          python3 scripts/agent_control.py --dry-run \
            --snapshot tests/fixtures/agent_control/dry-run.json > conductor-result.json
          python3 -m json.tool conductor-result.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: conductor-dry-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: conductor-result.json
          retention-days: 30

  apply-gate:
    name: Live apply gate
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
    needs: policy-dry-run
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Mint narrow control-plane token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.LP_CONTROL_APP_ID }}
          private-key: ${{ secrets.LP_CONTROL_APP_KEY }}
          owner: ${{ vars.LP_ORG }}
          permission-contents: write
          permission-issues: write
          permission-organization-projects: write
      - name: Reconcile and dispatch one bounded cycle
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          LP_ORG: ${{ vars.LP_ORG }}
          PROJECT_ID: ${{ vars.LP_PROJECT_ID }}
          STATUS_FIELD_ID: ${{ vars.LP_STATUS_FIELD_ID }}
          IN_PROGRESS_OPTION_ID: ${{ vars.LP_STATUS_IN_PROGRESS_OPTION_ID }}
          CONTROL_ISSUE: ${{ vars.LP_CONTROL_ISSUE }}
          OWNER_LOGIN: ${{ vars.LP_OWNER_LOGIN }}
          DAILY_MICROS: ${{ vars.LP_AGENT_DAILY_BUDGET_MICROS }}
          RUN_MICROS: ${{ vars.LP_AGENT_RUN_BUDGET_MICROS }}
        run: |
          test -n "$LP_ORG" && test -n "$PROJECT_ID" && test -n "$STATUS_FIELD_ID"
          test -n "$IN_PROGRESS_OPTION_ID" && test -n "$CONTROL_ISSUE" && test -n "$OWNER_LOGIN"
          test -n "$DAILY_MICROS" && test -n "$RUN_MICROS"
          python3 scripts/conductor_live.py --org "$LP_ORG" --project-id "$PROJECT_ID" \
            --status-field-id "$STATUS_FIELD_ID" --in-progress-option-id "$IN_PROGRESS_OPTION_ID" \
            --control-issue "$CONTROL_ISSUE" --owner-login "$OWNER_LOGIN" \
            --daily-budget-micros "$DAILY_MICROS" \
            --per-run-budget-micros "$RUN_MICROS" > conductor-live-result.json
