name: Weekly agent audits

on:
  schedule:
    - cron: "23 2 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Do not publish finding issues
        required: true
        type: boolean
        default: true

permissions: {}

concurrency:
  group: weekly-agent-audits
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Fail closed before any model or writer
        env:
          AGENTS_ENABLED: ${{ vars.AGENTS_ENABLED }}
        run: test "$AGENTS_ENABLED" = "true"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate credential-free publisher boundary
        run: |
          printf '[]\n' | python3 scripts/weekly_audits.py > audit-findings.json
          test "${{ github.event_name != 'workflow_dispatch' || inputs.dry_run }}" = "true" || {
            echo "Live auditors require budget leases, provider credentials, and a scoped issue publisher." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: weekly-audits-${{ github.run_id }}-${{ github.run_attempt }}
          path: audit-findings.json
          retention-days: 30
